services:
  scrcpy-webrtc:
    container_name: scrcpy-webrtc
    build:
      context: .
      dockerfile: 'Dockerfile'
    image: scrcpy-webrtc:latest
    network_mode: host
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      ADB_DEVICE_HOST: 127.0.0.1
      AUDIO_CODEC: raw
      # ADB_HOST / ADB_PORT point at the adb-server (default 127.0.0.1:5037).
      # For Docker on Linux/Mac, point ADB_HOST at host.docker.internal when
      # reusing the host's adb-server:
      # ADB_HOST: host.docker.internal
      # ADB_PORT: 5037
      # Optional: auto-attach a wireless-adb device from inside the container.
      # ADB_DEVICE_HOST: 192.168.1.20
      # ADB_DEVICE_PORT: 5555
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8010)+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
